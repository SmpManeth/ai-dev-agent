services:
  ai-agent-sandbox:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sandbox
    image: ai-dev-agent-sandbox:latest
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ${AI_AGENT_WORKSPACE_MOUNT:-./workspaces}:/workspace:ro
